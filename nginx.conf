# ─── Frota-Link — Nginx API Gateway ──────────────────────────────────────────
# api.frotalink.com.br → GoTrue + PostgREST + frota-api + MinIO
#
# Nomes internos dos serviços no EasyPanel (ajuste se renomear):
#   GoTrue    → go-true:9999
#   PostgREST → postg_rest:3000
#   frota-api → frota-api:4000   (ainda a ser criado)
#   MinIO     → minio:9000

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # ─── api.frotalink.com.br ────────────────────────────────────────────────
    server {
        listen 80;
        server_name api.frotalink.com.br;

        # CORS — necessário para o @supabase/supabase-js
        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, x-client-info, apikey, X-Api-Key' always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # ── /auth/v1/ → GoTrue ───────────────────────────────────────────────
        location /auth/v1/ {
            proxy_pass         http://go-true:9999/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ── /rest/v1/ → PostgREST ────────────────────────────────────────────
        location /rest/v1/ {
            proxy_pass         http://postg_rest:3000/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── /functions/v1/ → frota-api ───────────────────────────────────────
        location /functions/v1/ {
            proxy_pass         http://frota-api:4000/functions/v1/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            # SSE para smart-assistant (stream)
            proxy_buffering    off;
            proxy_cache        off;
        }

        # ── /storage/v1/ → MinIO ─────────────────────────────────────────────
        location /storage/v1/ {
            proxy_pass         http://minio:9000/;
            proxy_http_version 1.1;
            proxy_set_header   Host              minio:9000;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            client_max_body_size 100M;
        }

        # ── Health check ─────────────────────────────────────────────────────
        location /health {
            return 200 '{"status":"ok","gateway":"frota-nginx"}';
            add_header Content-Type application/json;
        }
    }
}

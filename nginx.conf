# ─── Frota-Link — Nginx API Gateway ──────────────────────────────────────────
# Instalado na VPS Banco (147.79.86.63)
#
# Serviços LOCAIS — mesma VPS Banco, mesma rede Docker:
#   go-true     :9999   (GoTrue)
#   postg_rest  :3000   (PostgREST)
#   minio       :9000   (MinIO)
#
# Serviço REMOTO — VPS App (185.139.1.146):
#   frota-api   :4000   (Edge Functions)
#
# Domínios:
#   api.frotalink.com → proxy para todos os serviços acima
#   app.frotalink.com → React build estático (pasta /var/www/frota)

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # ── Upstreams locais (VPS Banco — mesma rede Docker) ─────────────────────
    upstream gotrue {
        server go-true:9999;
        keepalive 16;
    }

    upstream postgrest {
        server postg_rest:3000;
        keepalive 32;
    }

    upstream minio_backend {
        server minio:9000;
        keepalive 16;
    }

    # Resolver externo — necessário para proxy_pass com variável (resolve em runtime)
    resolver 8.8.8.8 8.8.4.4 valid=30s;
    resolver_timeout 5s;

    # ─────────────────────────────────────────────────────────────────────────
    # api.frotalink.com — API Gateway
    # ─────────────────────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name api.frotalink.com;

        # CORS — necessário para @supabase/supabase-js
        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, x-client-info, apikey, X-Api-Key, x-supabase-api-version, accept-profile, content-profile, prefer, range, x-upsert, cache-control, content-md5, x-amz-meta-*' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Range, Content-Profile' always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # ── GoTrue — /verify (link de confirmação/recuperação enviado por email) ──
        # O GoTrue monta esse link usando só protocolo+host do API_EXTERNAL_URL,
        # ignorando qualquer path configurado — por isso precisa de rota direta na raiz.
        location = /verify {
            proxy_pass         http://gotrue/verify$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;
            proxy_hide_header  Access-Control-Allow-Origin;
            proxy_hide_header  Access-Control-Allow-Methods;
            proxy_hide_header  Access-Control-Allow-Headers;
            proxy_hide_header  Access-Control-Expose-Headers;
        }

        # ── GoTrue — /auth/v1/ ────────────────────────────────────────────────
        location /auth/v1/ {
            proxy_pass         http://gotrue/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;
            proxy_hide_header  Access-Control-Allow-Origin;
            proxy_hide_header  Access-Control-Allow-Methods;
            proxy_hide_header  Access-Control-Allow-Headers;
            proxy_hide_header  Access-Control-Expose-Headers;
        }

        # ── PostgREST — /rest/v1/ ─────────────────────────────────────────────
        location /rest/v1/ {
            proxy_pass         http://postgrest/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
            proxy_hide_header  Access-Control-Allow-Origin;
            proxy_hide_header  Access-Control-Allow-Methods;
            proxy_hide_header  Access-Control-Allow-Headers;
            proxy_hide_header  Access-Control-Expose-Headers;
        }

        # ── frota-api — /functions/v1/ (VPS App via HTTPS) ───────────────────
        location /functions/v1/ {
            set $frota_api https://frota-api.frotalink.com;
            proxy_pass         $frota_api;  # sem path: nginx passa /functions/v1/xxx inteiro
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header   Host              frota-api.frotalink.com;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;
            # SSE — smart-assistant usa stream: true
            proxy_buffering    off;
            proxy_cache        off;
            # frota-api já envia CORS — esconde para nginx controlar (evita duplicata)
            proxy_hide_header  Access-Control-Allow-Origin;
            proxy_hide_header  Access-Control-Allow-Methods;
            proxy_hide_header  Access-Control-Allow-Headers;
            proxy_hide_header  Access-Control-Expose-Headers;
        }

        # ── MinIO — /storage/v1/ ─────────────────────────────────────────────
        location /storage/v1/ {
            proxy_pass         http://minio_backend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              minio:9000;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 300s;
            client_max_body_size 100M;
            proxy_hide_header  Access-Control-Allow-Origin;
            proxy_hide_header  Access-Control-Allow-Methods;
            proxy_hide_header  Access-Control-Allow-Headers;
            proxy_hide_header  Access-Control-Expose-Headers;
        }

        # ── Health check ──────────────────────────────────────────────────────
        location /health {
            return 200 '{"status":"ok","gateway":"frota-nginx"}';
            add_header Content-Type application/json;
        }
    }

}
